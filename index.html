<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Your Gift Voucher</title>
    <!-- Confetti Library -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;800;900&display=swap" rel="stylesheet">
    <style>
        /* CSS reset and styles */
        body {
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background: #111;
            color: #fff;
            font-family: 'Outfit', sans-serif;
            overflow: hidden;
            -webkit-tap-highlight-color: transparent;
        }

        #bg-gradient {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, #1e1e1e, #3a3a3a, #111);
            z-index: -1;
            transition: opacity 1.5s ease;
        }

        #bg-gradient.active {
            opacity: 0;
        }

        #bg-gradient-bright {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, #ff9a9e 0%, #fecfef 99%, #fecfef 100%);
            z-index: -2;
        }

        #gift-screen, #voucher-screen {
            position: absolute;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            transition: opacity 1s ease-in-out;
        }

        #voucher-screen {
            opacity: 0;
            pointer-events: none;
        }

        /* Gift Box */
        .gift-box {
            font-size: 120px;
            cursor: pointer;
            animation: bounce 2s infinite;
            filter: drop-shadow(0 0 20px rgba(255,215,0,0.5));
            transition: transform 0.3s ease;
            user-select: none;
        }
        
        .gift-box:active {
            transform: scale(0.85);
        }

        @keyframes bounce {
            0%, 20%, 50%, 80%, 100% { transform: translateY(0); }
            40% { transform: translateY(-30px); }
            60% { transform: translateY(-15px); }
        }

        .tap-text {
            margin-top: 30px;
            font-size: 1.3rem;
            color: #ffd700;
            font-weight: 600;
            letter-spacing: 3px;
            text-transform: uppercase;
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0% { opacity: 0.4; }
            50% { opacity: 1; }
            100% { opacity: 0.4; }
        }

        /* Voucher Card */
        .voucher-card {
            background: rgba(255, 255, 255, 0.4);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            padding: 40px 30px;
            border-radius: 30px;
            box-shadow: 0 30px 60px rgba(0, 0, 0, 0.15), inset 0 0 0 1px rgba(255, 255, 255, 0.5);
            text-align: center;
            max-width: 340px;
            width: 85%;
            transform: translateY(60px) scale(0.95);
            opacity: 0;
            transition: all 1s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        .voucher-card.show {
            transform: translateY(0) scale(1);
            opacity: 1;
        }

        h1 {
            color: #2d3436;
            margin-bottom: 5px;
            font-size: 2.2rem;
            font-weight: 900;
        }

        .subtitle {
            color: #636e72;
            font-size: 1.05rem;
            margin-bottom: 35px;
            font-weight: 600;
        }

        .balance-container {
            background: rgba(255, 255, 255, 0.85);
            border-radius: 20px;
            padding: 25px 20px;
            margin-bottom: 35px;
            box-shadow: 0 10px 20px rgba(0,0,0,0.05), inset 0 0 0 1px rgba(255,154,158, 0.3);
            position: relative;
            overflow: hidden;
        }

        .balance-label {
            text-transform: uppercase;
            font-size: 0.85rem;
            letter-spacing: 2px;
            color: #b2bec3;
            font-weight: 800;
        }

        .balance-amount {
            font-size: 3.8rem;
            color: #ff4757;
            font-weight: 900;
            margin: 10px 0;
            display: flex;
            align-items: center;
            justify-content: center;
            text-shadow: 2px 2px 0px rgba(255,71,87,0.1);
        }

        .currency {
            font-size: 1.6rem;
            margin-right: 6px;
            color: #ff6b81;
        }

        /* Claim Button */
        .claim-btn {
            background: linear-gradient(45deg, #ff4757, #ff6b81);
            color: white;
            border: none;
            padding: 18px 40px;
            font-size: 1.3rem;
            font-weight: 800;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 12px 25px rgba(255, 71, 87, 0.4);
            transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
            text-transform: uppercase;
            letter-spacing: 1.5px;
            width: 100%;
            font-family: 'Outfit', sans-serif;
            position: relative;
            overflow: hidden;
        }

        .claim-btn::after {
            content: '';
            position: absolute;
            top: 0; left: -100%; width: 50%; height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.4), transparent);
            transition: 0.5s;
        }

        .claim-btn:active {
            transform: scale(0.96);
            box-shadow: 0 5px 15px rgba(255, 71, 87, 0.4);
        }

        .footer-note {
            margin-top: 25px;
            font-size: 0.9rem;
            color: #636e72;
            line-height: 1.5;
            font-weight: 600;
        }
    </style>
</head>
<body>

    <div id="bg-gradient-bright"></div>
    <div id="bg-gradient"></div>

    <!-- Start Screen: Gift Box -->
    <div id="gift-screen">
        <div class="gift-box" id="gift-box" onclick="openGift()">🎁</div>
        <div class="tap-text">Tap to Open</div>
    </div>

    <!-- Main Screen: Voucher -->
    <div id="voucher-screen">
        <div class="voucher-card" id="voucher-card">
            <h1>Surprise! 🎉</h1>
            <p class="subtitle">Your Beauty & Self-Care Treat</p>
            
            <div class="balance-container">
                <div class="balance-label">Voucher Value</div>
                <div class="balance-amount">
                    <span class="currency">Rs.</span>
                    <span id="counter">0</span>
                </div>
            </div>
            
            <button class="claim-btn" onclick="claimGift()">Claim Now</button>
            <p class="footer-note">Treat yourself to whatever makes you feel beautiful.</p>
        </div>
    </div>

    <script>
        // CHANGE THIS TO YOUR DESIRED VOUCHER AMOUNT
        const targetAmount = 15000; 
        let isOpened = false;
        
        function openGift() {
            if (isOpened) return;
            isOpened = true;

            // Hide gift screen & change background
            const giftScreen = document.getElementById('gift-screen');
            giftScreen.style.opacity = '0';
            document.getElementById('bg-gradient').classList.add('active');
            
            setTimeout(() => {
                giftScreen.style.display = 'none';
            }, 1000);

            // Show voucher screen
            const voucherScreen = document.getElementById('voucher-screen');
            voucherScreen.style.opacity = '1';
            voucherScreen.style.pointerEvents = 'auto';

            // Fire fireworks
            fireworks();

            // Animate card entry
            setTimeout(() => {
                document.getElementById('voucher-card').classList.add('show');
                // Start counter
                animateValue("counter", 0, targetAmount, 2500);
            }, 600);
        }

        function animateValue(id, start, end, duration) {
            const obj = document.getElementById(id);
            let startTimestamp = null;
            const step = (timestamp) => {
                if (!startTimestamp) startTimestamp = timestamp;
                const progress = Math.min((timestamp - startTimestamp) / duration, 1);
                // Ease out cubic
                const easeProgress = 1 - Math.pow(1 - progress, 3);
                const currentVal = Math.floor(easeProgress * (end - start) + start);
                
                // Format with commas
                obj.innerHTML = currentVal.toLocaleString();
                
                if (progress < 1) {
                    window.requestAnimationFrame(step);
                } else {
                    obj.innerHTML = end.toLocaleString();
                    // Final mini confetti on amount reach
                    confetti({
                        particleCount: 80,
                        spread: 70,
                        origin: { y: 0.6 },
                        colors: ['#ff4757', '#ff6b81', '#ffffff']
                    });
                    
                    // Trigger button shine
                    setTimeout(() => {
                        const btn = document.querySelector('.claim-btn');
                        btn.style.setProperty('--pseudo-left', '100%');
                        const style = document.createElement('style');
                        style.innerHTML = `.claim-btn::after { left: 100%; }`;
                        document.head.appendChild(style);
                    }, 500);
                }
            };
            window.requestAnimationFrame(step);
        }

        function fireworks() {
            var duration = 3500;
            var animationEnd = Date.now() + duration;
            var defaults = { startVelocity: 30, spread: 360, ticks: 60, zIndex: 0 };

            function randomInRange(min, max) {
                return Math.random() * (max - min) + min;
            }

            var interval = setInterval(function() {
                var timeLeft = animationEnd - Date.now();

                if (timeLeft <= 0) {
                    return clearInterval(interval);
                }

                var particleCount = 50 * (timeLeft / duration);
                // since particles fall down, start a bit higher than random
                confetti(Object.assign({}, defaults, { particleCount, origin: { x: randomInRange(0.1, 0.3), y: Math.random() - 0.2 } }));
                confetti(Object.assign({}, defaults, { particleCount, origin: { x: randomInRange(0.7, 0.9), y: Math.random() - 0.2 } }));
            }, 250);
        }
        
        function claimGift() {
            confetti({
                particleCount: 200,
                spread: 120,
                origin: { y: 0.6 },
                colors: ['#ff4757', '#ffffff', '#ff6b81', '#ff9a9e']
            });
            const btn = document.querySelector('.claim-btn');
            btn.innerText = 'Claimed! Enjoy ❤️';
            btn.style.background = 'linear-gradient(45deg, #2ed573, #7bed9f)';
            btn.style.boxShadow = '0 12px 25px rgba(46, 213, 115, 0.4)';
            btn.style.color = '#fff';
            btn.disabled = true;
        }
    </script>
</body>
</html>
